// 纯战役地图的对抗机关兼容。依赖 SourceMod 1.12+、l4d2_source_keyvalues
// 和现有 gamedata/l4d2_map_vote.txt；sharedplugins.cfg 已包含加载项。
//
// 默认：mp_gamemode=versus 且 mission 有 coop、没有原生 versus 的三方地图。
// 自动识别兼容投票插件写入的 AnneHappyInjected 标记；未知地图不自动处理。
// 将 info_gamemode 的 OnCoop / OnCoopPostIO 连接分别改接到
// OnVersus / OnVersusPostIO，同一实体同阶段原有的 versus 连接被替换。
// 没有 coop 连接的阶段保持原样。不伪造引擎模式，不主动触发 OnCoop。
//
// 0=排除；1=明确强制启用（包括已有原生 versus 的地图）；auto/未列出=自动。
// 每章分别填写实际 BSP 名，不含 .bsp。配置在下一次地图载入时读取。
// Stripper 也会改写/缓存地图实体：同一 info_gamemode 的补丁可能与本插件
// 冲突，加载顺序及下半场重建需实测。出现冲突时用 0 排除，逐图合并补丁；
// 不要在 cfg/stripper 中重复做相同输出替换。
//
// 服务器控制台/RCON：
//   sm_cvar l4d2_mapvote_versus_from_coop 2  // 投票与 mission 章节注入
//   sm_reload_vpk                         // 刷新地图列表
//   sm_mapvote_list                       // 打印当前模式实际三方战役菜单
//   sm_coop_versus_status                  // 查看本次载图的处理结果
// 加载插件或改开关后必须 changelevel 重新载图；不能热修已经执行的机关。
// 仅修改 mp_gamemode 不会重做适配，也必须重新载图；卸载不回滚本图实体。
// sm_cvar l4d2_coop_versus_compat 0 可停用下一次载图的处理。
//
// 这不是完整的战役引擎移植：不会修 NAV/flow、两半场实体清理差异、
// 自定义救援、脚本内部模式判断、动态创建的实体或 Stripper 后续修改。
// 逐图验证第一半场、换边重置、第二半场、逐章切关、救援和结算。
"CoopVersusCompat"
{
    // "example_m1" "1"
    // "example_m2" "0"
}
