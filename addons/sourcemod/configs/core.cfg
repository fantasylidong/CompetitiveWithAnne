/**
 * 此文件用于设置 SourceMod 核心的重要选项。
 * 如果文件或其中某个选项缺失，SourceMod 将使用该选项的默认值。
 */
"Core"
{
	/**
	 * 是否启用 SourceMod 日志。
	 *
	 * "on"		- 启用日志（默认）
	 * "off"	- 禁用日志
	 */
	"Logging"		"on"
	
	/**
	 * SourceMod 日志的记录方式。
	 *
	 * "daily"	- 每天创建一个新日志文件（默认）
	 * "map"	- 每次换图时创建一个新日志文件
	 * "game"	- 使用游戏自身的日志文件
	 */
	"LogMode"		"daily"
	
	/**
	 * 支持多语言的插件和扩展输出消息时使用的默认语言。
	 * 只有 languages.cfg 中列出的语言代码有效。
	 *
	 * "chi" 表示简体中文。
	 */
	"ServerLang"	"chi"
	
	/**
	 * 公开聊天命令的触发字符；留空可禁用。
	 */
	"PublicChatTrigger"		"!"
	
	/**
	 * 静默聊天命令的触发字符；留空可禁用。
	 */
	"SilentChatTrigger"		"/"
	
	/**
	 * 管理员使用静默聊天触发字符，但输入内容不是有效命令时，
	 * 默认会公开显示这条聊天消息。此选项可阻止误输入内容公开显示。
	 *
	 * "no" 为默认值；设为 "yes" 时阻止显示。
	 */
	"SilentFailSuppress"	"no"
	
	/**
	 * 客户端通过 setinfo 设置管理员密码时使用的键名。
	 * 出于安全考虑，必须修改此值后密码认证才会生效。
	 */
	"PassInfoVar"			"_password"

	/**
	 * 是否读取客户端的 cl_language 设置，用于服务端短语翻译。
	 *
	 * "on"		- 按客户端语言翻译（默认）
	 * "off"	- 统一使用服务器默认语言
	 */
	"AllowClLanguageVar"		"On"

	/**
	 * 是否禁用 SourceMod 的 gamedata 自动更新。
	 *
	 * 默认值为 "no"；设为 "yes" 会阻止自动更新。
	 */
	"DisableAutoUpdate"			"no"

	/**
	 * 设为 "yes" 后，gamedata 更新成功时会尝试重启 SourceMod。
	 * 重启过程会卸载并重新加载 SourceMod，然后重新载入当前地图。
	 * gamedata 通常在服务器启动时更新，影响较小，但为稳妥起见默认禁用。
	 */
	"ForceRestartAfterUpdate"	"no"

	/**
	 * 获取更新信息所使用的 URL。
	 * 此更新器暂不支持 SSL。
	 */
	"AutoUpdateURL"				"http://update.sourcemod.net/update/"

	/**
	 * 是否输出调试详情；目前用于记录 gamedata 更新过程。
	 */
	"DebugSpew"					"no"
	
	/**
	 * 设为 "yes" 后，SourceMod 会先通过 Steam 后端验证 SteamID 认证字符串，
	 * 验证通过后才授予管理员权限，可防止他人使用窃取的 Steam app ticket 冒充管理员。
	 * Steam 服务不可用时，管理员也会暂时无法通过认证。此安全功能仍属于实验性功能。
	 */
	"SteamAuthstringValidation"	"yes"
	
	/**
	 * 是否阻止已知或可能存在恶意行为的插件加载。
	 * 强烈建议保持启用；曾有恶意插件允许任意用户删除服务器文件或取得完整 RCON 权限。
	 *
	 * "yes"	- 阻止恶意或非法插件加载（默认）
	 * "no"		- 仅在恶意或非法插件加载时发出警告
	 */
	"BlockBadPlugins"	"yes"

	/**
	 * 插件执行时间过长并导致游戏服务器卡住时，SourceMod 会在指定秒数后尝试终止该插件。
	 * 设为 "0" 可禁用此功能。
	 */
	"SlowScriptTimeout"	"8"
	
	/**
	 * 根据 CS:GO 服务器规范，某些插件功能可能导致服务器所有者的全部
	 * Game Server Login Token（GSLT）被封禁。
	 *
	 * 启用此选项会阻止插件调用已知可能导致封禁的功能。
	 * 此选项只对 CS:GO 生效，但不能保证服务器绝对不会被封禁。
	 *
	 * 禁用此选项的风险由服务器所有者自行承担。
	 */
	"FollowCSGOServerGuidelines"	"yes"

	/**
	 * 控制 SourcePawn 运行时是否为 JIT 编译函数生成额外元数据，
	 * 供性能分析或调试使用。
	 *
	 * "none"    - 不生成额外 JIT 元数据
	 * "default" - 在 Linux 上生成基础 perf 元数据，退出时自动删除
	 * "perf"    - 生成基础 perf 元数据（仅 Linux，包含函数名）
	 * "jitdump" - 生成扩展 perf 元数据（仅 Linux，包含函数名、字节码和源码信息）
	 */
	"JITMetadata"	"default"

	// Anne 私有服务器将崩溃资料上传到 AnneWeb；接口只允许公网 IP
	// 位于 Anne 私用 SourceBans 服务器白名单内的服务器访问。
	// 当前 Accelerator 携带的 libcurl 不支持 HTTPS，这三个地址必须保留
	// 为 HTTP；AnneWeb 仅对这些白名单上传接口开放 HTTP。
	// 自行部署本项目时，请改用 Accelerator 官方接口：
	// "MinidumpUrl" "http://crash.limetech.org/submit"
	// "MinidumpSymbolUrl" "http://crash.limetech.org/symbols/submit"
	// "MinidumpBinaryUrl" "http://crash.limetech.org/binary/submit"
	"MinidumpAccount"		"76561198203126935"
	"MinidumpUrl"			"http://anne.trygek.com/accelerator/submit"
	"MinidumpPresubmit"		"1"

	// 上传系统和游戏模块符号。当前 Accelerator 内置的旧 Breakpad 无法
	// 安全解析部分 SourceMod 扩展的 DWARF5，级别 3 会导致崩溃上报线程
	// 自身崩溃；级别 2 跳过 addons/extensions，仍保留引擎侧符号。
	"MinidumpSymbolUrl"		"http://anne.trygek.com/accelerator/symbols/submit"
	"MinidumpSymbolUpload"		"2"
	"MinidumpBinaryUrl"		"http://anne.trygek.com/accelerator/binary/submit"
	"MinidumpBinaryUpload"		"yes"
}
