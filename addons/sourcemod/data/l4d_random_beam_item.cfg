// This file is the server default. Players can change how beams look to them with !beam (needs the SendProxy extension);
// their settings are saved in MySQL and only change what that player sees.
//
// "standard" is the standard beam. Every item below inherits the values it doesn't set itself.
// Players scale length and width as a percentage of the item's own values (100% = this file).
//
// Attributes explained:
//  "enable"   -> Show the beam by default. "0" = Hidden, "1" = Shown.
//                Hidden items can still be turned on by a player (see "player"); those beams are only created while someone asks for them.
//  "player"   -> Let players turn the beam on when it's hidden by default. "0" = No, "1" = Yes.
//  "group"    -> Item group in the player menu. Group names come from the "L4DRandomBeamItem_Group_<group>" translation phrase.
//  "random"   -> Apply a random beam color. "0" = OFF, "1" = ON.
//  "color"    -> Item beam color. Use three values between 0-255 separated by spaces. "<0-255> <0-255> <0-255>", e.g: "255 255 255". Ignored when "random" is "1".
//  "length"   -> Length of the spotlight beam.
//  "width"    -> Width of the spotlight beam. Max 102.3.
//  "hdr"      -> Multiplier for sprite color by when running in HDR mode. Value is divided by 10, e.g: "20" becomes "2.0".
//  "halo"     -> Enable halo glow (visible through walls). "0" = OFF, "1" = ON. Note: Depending on the color it may look too bright.
//
// "groups" -> Order of the item groups in the player menu. Groups used below but missing here are added at the end.
// "styles" -> Quick styles in the player menu. "length" and "width" are percentages of each item's beam, "halo" "-1" keeps the item's halo.

