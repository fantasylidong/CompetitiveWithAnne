// Network Quality Hint
// 检测玩家 ping/loss/choke，异常时提示打开网页复制服务器 IP/连接命令。

// 是否启用检测。
nqh_enable "1"

// 每隔多少秒在游戏服本地采样一次。采样不会逐条上报。
nqh_check_interval "5.0"

// ping 超过多少 ms 提醒。-1 关闭 ping 检测。
nqh_ping_limit "120"

// 丢包超过多少百分比提醒。-1 关闭丢包检测。
nqh_loss_limit "2.0"

// choke 超过多少百分比提醒。-1 关闭 choke 检测。
nqh_choke_limit "5.0"

// 连续多少次检测异常才提醒，避免瞬时波动刷屏。
nqh_bad_samples "3"

// 同一玩家两次提醒之间的冷却时间。
nqh_warn_cooldown "180.0"

// 服务器 IP 页面，玩家在这里复制对应服务器的 connect 命令。
nqh_ip_page_url "https://anne.trygek.com/ip.php"

// 玩家进服多少秒后显示一次当前网络状态。0 关闭。
nqh_intro_delay "25.0"

// 是否启用可选的玩家连接质量上报。插件源码默认关闭。
// 本仓库给网站白名单内的 Anne 游戏服显式打开；上报需要 SteamWorks（1.1.4+）。
// 未进白名单的社区服请改回 "0"。本地 ping/loss/choke 检测不依赖上报。
nqh_report_enable "1"

// NewAnneWeb 玩家连接质量采集接口。
nqh_report_url "http://anne.trygek.com/api/player/connection_quality.php"

// 正常连接每 10 分钟汇总一次；异常、恢复和断线会即时上报。
nqh_report_interval "600"

// 单次异常采样立即建立事件，连续 3 次正常采样后建立恢复事件。
nqh_report_bad_samples "1"
nqh_report_recovery_samples "3"
