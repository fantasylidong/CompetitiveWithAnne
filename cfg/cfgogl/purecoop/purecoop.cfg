// =======================================================================================
// PureCoop - Vanilla-style L4D2 Configuration
// =======================================================================================

// [server.smx]
confogl_addcvar anne_heal_on_leave_safe_area 0
confogl_addcvar anne_reset_on_transition 0
confogl_addcvar anne_heal50_on_transition 1

// [advertisements.smx]
confogl_addcvar sm_advertisements_file advertisements_pure.txt

// [l4d2_npc_manager.smx]
confogl_addcvar nb_uf_onoff 1
confogl_addcvar nb_uf_Common 0.02
confogl_addcvar nb_uf_Witch 0.02
confogl_addcvar nb_uf_Smoker 0.1
confogl_addcvar nb_uf_Boomer 0.1
confogl_addcvar nb_uf_Hunter 0.1
confogl_addcvar nb_uf_Spitter 0.1
confogl_addcvar nb_uf_Jockey 0.1
confogl_addcvar nb_uf_Charger 0.1
confogl_addcvar nb_uf_Tank 0.1
confogl_addcvar nb_uf_sb 0.1

// Confogl Additional
confogl_setcvars
confogl_resetclientcvars
