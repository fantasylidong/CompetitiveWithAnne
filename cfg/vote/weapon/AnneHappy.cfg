sm_weapon_attributes_reset
sm_cvar l4d2_player_attr_db_weapon_config "AnneHappy"

/////////////////////////////
// [Static shotgun spread] //
/////////////////////////////

// First ring settings
confogl_addcvar sgspread_ring1_bullets 8
confogl_addcvar sgspread_ring1_factor  2    // Does not affect the actual first ring, just the distance between ring 1 and 2 (Only affects pump)
confogl_addcvar sgspread_center_pellet 1

/////////////////////////////
//  [SMG Tweaks 'n Stuff]  //
/////////////////////////////
// Orthogonal 3-stage SMG sweet spots for AnneHappy (0-300u -> 300-650u -> 650u+):
// - Silenced SMG: close-range burst (0-300u, 29 dmg, 0.87 falloff, 250u gainrange, 1400u range, 0.85 tankmult).
// - MP5: mid-range carbine (300-650u, 31 dmg, 60 clip/defclip, 2.70s reload, 0.945 falloff, 378u gainrange, 350u charpen).
// - Uzi: long-range & run-and-gun laser (650-2500u & 265u+ move, 24 dmg, 0.965 falloff, 1.15 move spread, 1.55s reload).
sm_weapon smg damage 24
sm_weapon smg range 2500
sm_weapon smg rangemod 0.965
sm_weapon smg gainrange 0
sm_weapon smg tankdamagemult 0.91
sm_weapon smg reloadduration 1.55
sm_weapon smg minstandspread 0.72
sm_weapon smg minduckspread 0.45
sm_weapon smg maxmovespread 1.15
sm_weapon smg spreadpershot 0.13
sm_weapon smg spreaddecay 6.0
sm_weapon smg maxspread 18.0

sm_weapon smg_silenced damage 29
sm_weapon smg_silenced range 1400
sm_weapon smg_silenced rangemod 0.87
sm_weapon smg_silenced gainrange 250
sm_weapon smg_silenced tankdamagemult 0.85
sm_weapon smg_silenced reloadduration 1.9
sm_weapon smg_silenced minstandspread 0.95
sm_weapon smg_silenced minduckspread 0.68
sm_weapon smg_silenced maxmovespread 1.95
sm_weapon smg_silenced spreadpershot 0.21
sm_weapon smg_silenced spreaddecay 5.0
sm_weapon smg_silenced maxspread 28.0

sm_weapon smg_mp5 damage 31
sm_weapon smg_mp5 range 1580
sm_weapon smg_mp5 rangemod 0.945
sm_weapon smg_mp5 gainrange 378
sm_weapon smg_mp5 tankdamagemult 0.92
sm_weapon smg_mp5 clipsize 60
sm_weapon smg_mp5 defclip 60
sm_weapon smg_mp5 reloadduration 2.7
sm_weapon smg_mp5 minstandspread 0.48
sm_weapon smg_mp5 minduckspread 0.28
sm_weapon smg_mp5 maxmovespread 2.65
sm_weapon smg_mp5 spreadpershot 0.15
sm_weapon smg_mp5 spreaddecay 5.0
sm_weapon smg_mp5 maxspread 25.0
sm_weapon smg_mp5 penlayers 2
sm_weapon smg_mp5 penpower 40
sm_weapon smg_mp5 charpenmaxdist 350
