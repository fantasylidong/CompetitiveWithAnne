sm_weapon_attributes_reset
sm_cvar l4d2_player_attr_db_weapon_config "AnneHappy"

/////////////////////////////
// [Static shotgun spread] //
/////////////////////////////

// First ring settings
confogl_addcvar sgspread_ring1_bullets 8
confogl_addcvar sgspread_ring1_factor  2    // Does not affect the actual first ring, just the distance between ring 1 and 2 (Only affects pump)
confogl_addcvar sgspread_center_pellet 1

/////////////////////////////
//  [SMG Tweaks 'n Stuff]  //
/////////////////////////////
// Orthogonal SMG roles scaled for AnneHappy:
// - Silenced SMG: close-range burst (27 dmg), steeper falloff (0.80) and sustained-fire bloom (0.38).
// - MP5: heavy carbine (31 dmg, 55 clip, 0.75/0.45 stand/duck spread, 40 penpower), penalized on move (2.60) and reload (2.6s).
// - Uzi: mobile laser (24 dmg, 1.35 move spread, 6.0 decay, 1.65s fast reload, 0.935 gentle falloff).
sm_weapon smg damage 24
sm_weapon smg rangemod 0.935
sm_weapon smg tankdamagemult 0.96
sm_weapon smg reloadduration 1.65
sm_weapon smg minstandspread 1.0
sm_weapon smg minduckspread 0.7
sm_weapon smg maxmovespread 1.35
sm_weapon smg spreadpershot 0.20
sm_weapon smg spreaddecay 6.0
sm_weapon smg maxspread 20.0

sm_weapon smg_silenced damage 27
sm_weapon smg_silenced rangemod 0.80
sm_weapon smg_silenced tankdamagemult 0.94
sm_weapon smg_silenced reloadduration 2.0
sm_weapon smg_silenced minstandspread 1.25
sm_weapon smg_silenced minduckspread 0.9
sm_weapon smg_silenced maxmovespread 2.0
sm_weapon smg_silenced spreadpershot 0.38
sm_weapon smg_silenced spreaddecay 5.0
sm_weapon smg_silenced maxspread 30.0
sm_weapon smg_silenced gainrange 0

sm_weapon smg_mp5 damage 31
sm_weapon smg_mp5 range 2200
sm_weapon smg_mp5 rangemod 0.88
sm_weapon smg_mp5 tankdamagemult 0.95
sm_weapon smg_mp5 clipsize 55
sm_weapon smg_mp5 reloadduration 2.6
sm_weapon smg_mp5 minstandspread 0.75
sm_weapon smg_mp5 minduckspread 0.45
sm_weapon smg_mp5 maxmovespread 2.6
sm_weapon smg_mp5 spreadpershot 0.35
sm_weapon smg_mp5 spreaddecay 5.0
sm_weapon smg_mp5 maxspread 25.0
sm_weapon smg_mp5 penpower 40
sm_weapon smg_mp5 charpenmaxdist 300
