/////////////////////////////////
// Pump (17x20=340, 0-160u close burst) vs Chrome (18x17=306, 160u+ tight mid-range) with center pellet enabled; crouch spread 0.4 (native 0) so crouching no longer centers the whole pattern perfectly beyond ~250u.
sm_weapon shotgun_chrome damage 18
sm_weapon shotgun_chrome bullets 17
sm_weapon shotgun_chrome scatterpitch 1.75
sm_weapon shotgun_chrome scatteryaw 1.75
sm_weapon shotgun_chrome minduckspread 0.4
sm_weapon shotgun_chrome rangemod 0.78
sm_weapon shotgun_chrome tankdamagemult 0.85
sm_weapon shotgun_chrome reloaddurationmult 0.77
sm_weapon pumpshotgun damage 17
sm_weapon pumpshotgun bullets 20
sm_weapon pumpshotgun scatterpitch 2.50
sm_weapon pumpshotgun scatteryaw 2.50
sm_weapon pumpshotgun minduckspread 0.4
sm_weapon pumpshotgun rangemod 0.67
sm_weapon pumpshotgun tankdamagemult 0.84
sm_weapon pumpshotgun reloaddurationmult 0.77
