sm_weapon_attributes_reset
sm_cvar l4d2_player_attr_db_weapon_config "AnneHappyPlus"

/////////////////////////////
// [Static shotgun spread] //
/////////////////////////////

// First ring settings
confogl_addcvar sgspread_ring1_bullets 8
confogl_addcvar sgspread_ring1_factor  2    // Does not affect the actual first ring, just the distance between ring 1 and 2 (Only affects pump)
confogl_addcvar sgspread_center_pellet 1

/////////////////////////////
//  [SMG Tweaks 'n Stuff]  //
/////////////////////////////
// SMG roles for AnneHappyPlus: Silenced = close-mid after the shotgun hand-off, MP5 = stationary/crouched 320u+, Uzi = run-and-gun.
// - Silenced SMG: close-mid SMG after the shotgun hand-off (31 dmg, 0.875 falloff, 450u gainrange so damage holds through the 300-650u band where ~half of live hits land; AnneHappy keeps 320u; 0.80 stand / 1.70 move spread, 1400u range, 0.80 tankmult).
// - MP5: stationary mid-long carbine (stand 320u+ / crouch 350u+, 33 dmg, 60 clip/defclip, 2.70s reload, 0.955 falloff, 600u gainrange, 2200u range, 2.2 move spread, 350u charpen).
// - Uzi: run-and-gun SMG, leads while moving from ~260u (26 dmg, 0.95 falloff, 1.35 move spread, 1.75s reload in both modes).
// Independent tankdamagemult (0.84 / 0.80 / 0.86) keeps 100u 3-player Tank focus fire near the released baseline (~1159 DPS).
sm_weapon smg damage 26
sm_weapon smg range 2500
sm_weapon smg rangemod 0.95
sm_weapon smg gainrange 0
sm_weapon smg tankdamagemult 0.84
sm_weapon smg reloadduration 1.75
sm_weapon smg minstandspread 0.72
sm_weapon smg minduckspread 0.45
sm_weapon smg maxmovespread 1.35
sm_weapon smg spreadpershot 0.13
sm_weapon smg spreaddecay 6.0
sm_weapon smg maxspread 18.0

sm_weapon smg_silenced damage 31
sm_weapon smg_silenced range 1400
sm_weapon smg_silenced rangemod 0.875
sm_weapon smg_silenced gainrange 450
sm_weapon smg_silenced tankdamagemult 0.80
sm_weapon smg_silenced reloadduration 1.9
sm_weapon smg_silenced minstandspread 0.80
sm_weapon smg_silenced minduckspread 0.55
sm_weapon smg_silenced maxmovespread 1.70
sm_weapon smg_silenced spreadpershot 0.17
sm_weapon smg_silenced spreaddecay 5.0
sm_weapon smg_silenced maxspread 28.0

sm_weapon smg_mp5 damage 33
sm_weapon smg_mp5 range 2200
sm_weapon smg_mp5 rangemod 0.955
sm_weapon smg_mp5 gainrange 600
sm_weapon smg_mp5 tankdamagemult 0.86
sm_weapon smg_mp5 clipsize 60
sm_weapon smg_mp5 defclip 60
sm_weapon smg_mp5 reloadduration 2.7
sm_weapon smg_mp5 minstandspread 0.48
sm_weapon smg_mp5 minduckspread 0.28
sm_weapon smg_mp5 maxmovespread 2.2
sm_weapon smg_mp5 spreadpershot 0.15
sm_weapon smg_mp5 spreaddecay 5.0
sm_weapon smg_mp5 maxspread 25.0
sm_weapon smg_mp5 penlayers 2
sm_weapon smg_mp5 penpower 40
sm_weapon smg_mp5 charpenmaxdist 350
