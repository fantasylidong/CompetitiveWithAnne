; BEGIN GENERATED GLOBAL FILTERS: zonemod_anne
; =====================================================
; ==                  WITCH REMOVAL                  ==
; ==           Remove scripted witch spawns          ==
; =====================================================
; --- Uncomment to remove scripted witch spawns
filter:
{
	"classname" "info_zombie_spawn"
	"population" "witch"
}
{
	"classname" "info_zombie_spawn"
	"population" "witch_bride"
}
{
	"targetname" "witch_spawn"
}
{
	"targetname" "witch_case"
}
{
	"targetname" "bridewitch"
}
; =====================================================
; ==                RAGDOLL REMOVAL                  ==
; ==   Remove prop_ragdoll entities for performance  ==
; =====================================================
; --- Ragdolls can cause CPU and networking performance issues, some custom campaigns over use them so just remove them
filter:
{
	"classname" "prop_ragdoll"
}
