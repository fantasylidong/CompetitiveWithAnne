{
    "classname" "weapon_pain_pills_spawn"
    "angles" "0 0 0"
    "solid" "6"
    "spawnflags" "2"
    "origin" "-3056 184 -1668"
}
{
    "classname" "weapon_pain_pills_spawn"
    "angles" "0 0 0"
    "solid" "6"
    "spawnflags" "2"
    "origin" "-3296 -1776 -1680"
}
{
    "classname" "prop_health_cabinet"
    "origin" "-5152 -464 -1956"
    "angles" "0 180 0"
    "model" "models/props_interiors/medicalcabinet02.mdl"
    "solid" "6"
    "disableshadows" "1"
