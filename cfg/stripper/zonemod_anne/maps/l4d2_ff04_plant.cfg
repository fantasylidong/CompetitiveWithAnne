; ==                PROP COLLISION FIX               ==
; ==       Remove collision with selected props      ==
; =====================================================
; --- Physics Props: Spawnflags = 4 (Debris)
; --- Dynamic Props: Solid = 0 (No collision)
modify:
; --- Dead bodies
{
	match:
	{
		"classname" "/.*prop_physics.*/"
		"model" "/.*deadbodies.*/"
	}
	insert:
	{
		"spawnflags" "4"
	}
}
{
	match:
