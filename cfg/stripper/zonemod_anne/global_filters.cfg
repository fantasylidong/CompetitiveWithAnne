; =====================================================
; ==            PILL CABINET MAX OVERRIDE            ==
; ==              Pill cabinet max pills             ==
; =====================================================
; --- Limit pill cabinets to a max of 2 pills
; --- This can be manually overridden on each map, as global filters runs first
modify:
{
	match:
	{
		"classname" "prop_health_cabinet"
		"HealthCount" "4"
	}
	replace:
	{
		"HealthCount" "2"
	}
}
{
	match:
	{
		"classname" "prop_health_cabinet"
		"HealthCount" "3"
	}
	replace:
	{
		"HealthCount" "2"
	}
}
