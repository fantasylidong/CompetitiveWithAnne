; =====================================================
; ==                 ITEM DENSITY FIX                ==
; ==   Fix item density being set to 0 on some maps  ==
; =====================================================
modify:
; --- Ammo piles
{
	match:
	{
		"AmmoDensity" "0"
	}
	replace:
	{
		"AmmoDensity" "2"
	}
}
; --- Pills
{
	match:
	{
		"PainPillDensity" "0"
	}
	replace:
	{
		"PainPillDensity" "1"
	}
}
; =====================================================
; ==                   WEAPON SKINS                  ==
; ==  Use random skins, see weapon_skin_enabler.nut  ==
; =====================================================
add:
{
	"classname" "logic_auto"
	"OnMapSpawn" "!self,RunScriptFile,weapon_skin_enabler,5,-1"
}
