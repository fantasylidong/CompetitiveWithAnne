name: CompetitiveWithAnne Update Achieve Release

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Run Tags'
        required: false
  push:
    paths:
      - 'README.md'
      - 'README-*.md'
      - 'Update_log.md'
      - 'Update_log.*.md'
    branches:
      - master

jobs:
  release:
    if: github.repository == 'fantasylidong/CompetitiveWithAnne'
    name: Upload CompetitiveWithAnne Achieve if a new commit was been push.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/fantasylidong/CompetitiveWithAnne
          git clone --depth 1 -b zonemod https://github.com/fantasylidong/anne.git

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build full, norank, and nomysql archives
        run: |
          set -euo pipefail

          RELEASE_NAME="CompetitiveWithAnne-${{ steps.date.outputs.date }}"
          STAGING="$(mktemp -d)"

          stage_package() {
            local variant="$1"
            PACKAGE_DIR="$STAGING/$variant/$RELEASE_NAME"
            PLUGIN_DIR="$PACKAGE_DIR/left4dead2/addons/sourcemod/plugins"

            mkdir -p "$PACKAGE_DIR/left4dead2"
            cp -a CompetitiveWithAnne/* "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/sound "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/models "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/materials "$PACKAGE_DIR/left4dead2/"
          }

          archive_package() {
            local variant="$1"
            local asset="$2"
            tar -czf "$GITHUB_WORKSPACE/$asset" -C "$STAGING/$variant" "$RELEASE_NAME"
          }

          remove_anne_optional_plugin() {
            local plugin="$1"
            rm -f "$PLUGIN_DIR/optional/AnneHappy/$plugin.smx"
            find "$PACKAGE_DIR/left4dead2/cfg" -type f -name '*.cfg' \
              -exec sed -i "\|optional/AnneHappy/$plugin\\.smx|d" {} +
          }

          stage_package full
          archive_package full "$RELEASE_NAME.tar.gz"

          stage_package norank
          # Dynamic difficulty and traitor quota both depend on the removed ranking databases.
          rm -f \
            "$PLUGIN_DIR/extend/l4d_stats.smx" \
            "$PLUGIN_DIR"/extend/sbpp_* \
            "$PLUGIN_DIR/extend/lilac.smx"
          remove_anne_optional_plugin annehappy_dynamic_ai_difficulty
          remove_anne_optional_plugin anne_traitor_quota
          archive_package norank "$RELEASE_NAME-norank.tar.gz"

          stage_package nomysql
          # Keep infected_control and spawn_vote_menu.  The former now treats quota
          # persistence as optional; the latter defaults to SourceMod's local SQLite.
          rm -f \
            "$PLUGIN_DIR/chat-processor.smx" \
            "$PLUGIN_DIR/extend/hextags.smx" \
            "$PLUGIN_DIR/extend/l4d_stats.smx" \
            "$PLUGIN_DIR"/extend/sbpp_* \
            "$PLUGIN_DIR/extend/lilac.smx" \
            "$PLUGIN_DIR/extend/rpg.smx" \
            "$PLUGIN_DIR/extend/chatlog.smx" \
            "$PLUGIN_DIR/extend/veterans.smx" \
            "$PLUGIN_DIR/extend/l4d2_damage_show.smx" \
            "$PLUGIN_DIR/extend/punch_angle.smx" \
            "$PLUGIN_DIR/extend/l4d2_blacklist.smx" \
            "$PLUGIN_DIR/extend/l4d2_hitsound.smx" \
            "$PLUGIN_DIR/extend/global_chat.smx" \
            "$PLUGIN_DIR/extend/l4d_player_count_unload_mode.smx"
          remove_anne_optional_plugin annehappy_dynamic_ai_difficulty
          remove_anne_optional_plugin anne_traitor_quota
          cp -f "$PLUGIN_DIR/disabled/rpg.smx" "$PLUGIN_DIR/extend/rpg.smx"
          archive_package nomysql "$RELEASE_NAME-nomysql.tar.gz"

      - name: Update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          files: |
            CompetitiveWithAnne-${{ steps.date.outputs.date }}.tar.gz
            CompetitiveWithAnne-${{ steps.date.outputs.date }}-norank.tar.gz
            CompetitiveWithAnne-${{ steps.date.outputs.date }}-nomysql.tar.gz
          tag_name: CompetitiveWithAnne-stable-release-${{ steps.date.outputs.date }}
