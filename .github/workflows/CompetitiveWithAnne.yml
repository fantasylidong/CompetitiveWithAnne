name: CompetitiveWithAnne Update Achieve Release

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Run Tags'
        required: false
  push:
    paths:
      - 'README.md'
      - 'README-*.md'
      - 'Update_log.md'
      - 'Update_log.*.md'
    branches:
      - master

jobs:
  release:
    if: github.repository == 'fantasylidong/CompetitiveWithAnne'
    name: Upload CompetitiveWithAnne Achieve if a new commit was been push.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        run: |
          git clone https://github.com/fantasylidong/CompetitiveWithAnne
          git clone --depth 1 -b zonemod https://github.com/fantasylidong/anne.git

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Build full, norank, and nomysql archives
        run: |
          set -euo pipefail

          RELEASE_NAME="CompetitiveWithAnne-${{ steps.date.outputs.date }}"
          STAGING="$(mktemp -d)"

          stage_package() {
            local variant="$1"
            PACKAGE_DIR="$STAGING/$variant/$RELEASE_NAME"
            PLUGIN_DIR="$PACKAGE_DIR/left4dead2/addons/sourcemod/plugins"

            mkdir -p "$PACKAGE_DIR/left4dead2"
            cp -a CompetitiveWithAnne/* "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/sound "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/models "$PACKAGE_DIR/left4dead2/"
            cp -a anne/left4dead2/materials "$PACKAGE_DIR/left4dead2/"
          }

          archive_package() {
            local variant="$1"
            local asset="$2"
            tar -czf "$GITHUB_WORKSPACE/$asset" -C "$STAGING/$variant" "$RELEASE_NAME"
          }

          plugin_count() {
            find "$PLUGIN_DIR" -type f -name '*.smx' -printf '.' | wc -c | tr -d '[:space:]'
          }

          remove_plugin() {
            local plugin="$1"

            if [ ! -f "$PLUGIN_DIR/$plugin.smx" ]; then
              echo "::error::Expected packaged plugin not found: $plugin.smx"
              exit 1
            fi
            rm -f "$PLUGIN_DIR/$plugin.smx"
            find "$PACKAGE_DIR/left4dead2/cfg" -type f -name '*.cfg' \
              -exec sed -i "\|$plugin\\.smx|d" {} +
          }

          stage_package full
          FULL_PLUGIN_COUNT="$(plugin_count)"
          echo "full: $FULL_PLUGIN_COUNT plugins"
          archive_package full "$RELEASE_NAME.tar.gz"

          stage_package norank
          # Dynamic difficulty and traitor quota both depend on the removed ranking databases.
          NORANK_REMOVALS=(
            extend/l4d_stats
            extend/sbpp_admcfg
            extend/sbpp_checker
            extend/sbpp_comms
            extend/sbpp_main
            extend/sbpp_report
            extend/sbpp_sleuth
            extend/lilac
            optional/AnneHappy/annehappy_dynamic_ai_difficulty
            optional/AnneHappy/anne_traitor_quota
          )
          for plugin in "${NORANK_REMOVALS[@]}"; do
            remove_plugin "$plugin"
          done
          NORANK_PLUGIN_COUNT="$(plugin_count)"
          echo "norank: $NORANK_PLUGIN_COUNT plugins (${#NORANK_REMOVALS[@]} removed)"
          archive_package norank "$RELEASE_NAME-norank.tar.gz"

          stage_package nomysql
          # Keep local SQLite users l4d2_map_vote and spawn_vote_menu.  Both the
          # active and 2026-07 infected_control builds tolerate a missing quota provider.
          NOMYSQL_REMOVALS=(
            extend/l4d_stats
            extend/sbpp_admcfg
            extend/sbpp_checker
            extend/sbpp_comms
            extend/sbpp_main
            extend/sbpp_report
            extend/sbpp_sleuth
            extend/lilac
            extend/chatlog
            extend/veterans
            extend/l4d2_damage_show
            extend/l4d2_blacklist
            extend/l4d2_hitsound
            extend/l4d2_scripted_hud
            extend/global_chat
            extend/l4d_player_count_unload_mode
            optional/AnneHappy/annehappy_dynamic_ai_difficulty
            optional/AnneHappy/anne_traitor_quota
          )
          for plugin in "${NOMYSQL_REMOVALS[@]}"; do
            remove_plugin "$plugin"
          done
          # Replace the MySQL-backed RPG build without removing its cfg load lines.
          cp -f "$PLUGIN_DIR/disabled/rpg.smx" "$PLUGIN_DIR/extend/rpg.smx"
          NOMYSQL_PLUGIN_COUNT="$(plugin_count)"
          echo "nomysql: $NOMYSQL_PLUGIN_COUNT plugins (${#NOMYSQL_REMOVALS[@]} removed; extend/rpg.smx replaced)"
          archive_package nomysql "$RELEASE_NAME-nomysql.tar.gz"

      - name: Update release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        with:
          files: |
            CompetitiveWithAnne-${{ steps.date.outputs.date }}.tar.gz
            CompetitiveWithAnne-${{ steps.date.outputs.date }}-norank.tar.gz
            CompetitiveWithAnne-${{ steps.date.outputs.date }}-nomysql.tar.gz
          tag_name: CompetitiveWithAnne-stable-release-${{ steps.date.outputs.date }}
