name: Build Anne native extensions

on:
  workflow_dispatch:
  push:
    paths:
      - "extensions/anne_nextbot/**"
      - "addons/sourcemod/extensions/anne_nextbot.autoload"
      - "addons/sourcemod/gamedata/anne_nextbot.games.txt"
      - "addons/sourcemod/scripting/include/anne_nextbot.inc"
      - "extensions/anne_spawn_accel/**"
      - "addons/sourcemod/extensions/anne_spawn_accel.autoload"
      - "addons/sourcemod/gamedata/anne_spawn_accel.games.txt"
      - "addons/sourcemod/scripting/include/anne_spawn_accel.inc"
      - ".github/workflows/check_plugins.yml"
  pull_request:
    paths:
      - "extensions/anne_nextbot/**"
      - "addons/sourcemod/extensions/anne_nextbot.autoload"
      - "addons/sourcemod/gamedata/anne_nextbot.games.txt"
      - "addons/sourcemod/scripting/include/anne_nextbot.inc"
      - "extensions/anne_spawn_accel/**"
      - "addons/sourcemod/extensions/anne_spawn_accel.autoload"
      - "addons/sourcemod/gamedata/anne_spawn_accel.games.txt"
      - "addons/sourcemod/scripting/include/anne_spawn_accel.inc"
      - ".github/workflows/check_plugins.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            container_image: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
            suffix: so
          - platform: windows
            os: windows-latest
            container_image: null
            suffix: dll
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Install AMBuild
        shell: bash
        run: python3 -m pip install git+https://github.com/alliedmodders/ambuild

      - name: Fetch SourceMod and SDK dependencies
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/alliedmodders/sourcemod "$RUNNER_TEMP/sourcemod"
          mkdir -p "$RUNNER_TEMP/dependencies/sourcemod"
          cd "$RUNNER_TEMP/dependencies"
          "$RUNNER_TEMP/sourcemod/tools/checkout-deps.sh" -m -s l4d2

      - name: Add Anne extension build targets
        shell: bash
        run: |
          cp -R extensions/anne_nextbot "$RUNNER_TEMP/sourcemod/extensions/anne_nextbot"
          cp -R extensions/anne_spawn_accel "$RUNNER_TEMP/sourcemod/extensions/anne_spawn_accel"
          python3 -c "from pathlib import Path; p=Path(r'$RUNNER_TEMP/sourcemod/AMBuildScript'); s=p.read_text(); b=s.index('builder.Build(BuildScripts'); p.write_text(s[:b] + \"BuildScripts = [\\n  'extensions/anne_nextbot/AMBuilder',\\n  'extensions/anne_spawn_accel/AMBuilder',\\n]\\n\\n\" + s[b:])"

      - name: Configure and build x86
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/sourcemod/build"
          cd "$RUNNER_TEMP/sourcemod/build"
          python3 ../configure.py \
            --enable-optimize \
            --no-mysql \
            --sdks=l4d2 \
            --targets=x86 \
            "--mms-path=$RUNNER_TEMP/dependencies/mmsource-1.12" \
            "--hl2sdk-root=$RUNNER_TEMP/dependencies"
          ambuild

      - name: Package
        shell: bash
        run: |
          package="$RUNNER_TEMP/package/addons/sourcemod"
          mkdir -p "$package/extensions" "$package/gamedata" "$package/scripting/include"
          nextbot_binary=$(find "$RUNNER_TEMP/sourcemod/build" -type f -name "anne_nextbot.ext.2.l4d2.${{ matrix.suffix }}" -print -quit)
          spawn_binary=$(find "$RUNNER_TEMP/sourcemod/build" -type f -name "anne_spawn_accel.ext.2.l4d2.${{ matrix.suffix }}" -print -quit)
          test -n "$nextbot_binary"
          test -n "$spawn_binary"
          cp "$nextbot_binary" "$spawn_binary" "$package/extensions/"
          cp addons/sourcemod/extensions/anne_nextbot.autoload "$package/extensions/"
          cp addons/sourcemod/extensions/anne_spawn_accel.autoload "$package/extensions/"
          cp addons/sourcemod/gamedata/anne_nextbot.games.txt "$package/gamedata/"
          cp addons/sourcemod/gamedata/anne_spawn_accel.games.txt "$package/gamedata/"
          cp addons/sourcemod/scripting/include/anne_nextbot.inc "$package/scripting/include/"
          cp addons/sourcemod/scripting/include/anne_spawn_accel.inc "$package/scripting/include/"

      - uses: actions/upload-artifact@v4
        with:
          name: anne-native-extensions-${{ matrix.platform }}-x86
          path: ${{ runner.temp }}/package
          if-no-files-found: error
